# Installation de référence : docker compose up --build, puis http://localhost:8080
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      INVOICING_DEMO_MODE: "true"
    volumes:
      - donnees:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  donnees:
